<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinh Viên Chi Tiêu - App Quản Lý</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans">

    <div class="max-w-md mx-auto min-h-screen shadow-lg bg-white">
        <header class="bg-indigo-600 p-6 text-white rounded-b-3xl shadow-md">
            <p class="text-sm opacity-80">Tổng số dư của bạn</p>
            <h1 id="total-balance" class="text-3xl font-bold mt-1">0đ</h1>
            <div class="flex justify-between mt-6 bg-indigo-700 bg-opacity-40 p-4 rounded-2xl">
                <div>
                    <p class="text-xs opacity-80 uppercase tracking-wider">Thu nhập</p>
                    <p id="total-income" class="font-semibold text-green-300">+0đ</p>
                </div>
                <div class="text-right">
                    <p class="text-xs opacity-80 uppercase tracking-wider">Chi tiêu</p>
                    <p id="total-expense" class="font-semibold text-red-300">-0đ</p>
                </div>
            </div>
        </header>

        <main class="p-6">
            <div class="mb-8">
                <canvas id="expenseChart" height="200"></canvas>
            </div>

            <section class="mb-8 bg-gray-100 p-4 rounded-2xl">
                <h2 class="text-sm font-bold text-gray-700 mb-4 uppercase">Thêm giao dịch mới</h2>
                <div class="space-y-3">
                    <input type="text" id="desc" placeholder="Tên khoản chi (ví dụ: Ăn trưa)" class="w-full p-3 rounded-xl border-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
                    <input type="number" id="amount" placeholder="Số tiền (VND)" class="w-full p-3 rounded-xl border-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
                    <div class="flex gap-2">
                        <button onclick="addTransaction('income')" class="flex-1 bg-green-500 text-white py-3 rounded-xl font-bold hover:bg-green-600 transition">Thu nhập</button>
                        <button onclick="addTransaction('expense')" class="flex-1 bg-red-500 text-white py-3 rounded-xl font-bold hover:bg-red-600 transition">Chi tiêu</button>
                    </div>
                </div>
            </section>

            <section>
                <h2 class="text-sm font-bold text-gray-700 mb-4 uppercase">Lịch sử gần đây</h2>
                <ul id="transaction-list" class="space-y-3">
                    </ul>
            </section>
        </main>
    </div>

    <script>
        let transactions = [];
        let myChart;

        function updateUI() {
            const list = document.getElementById('transaction-list');
            const balanceEl = document.getElementById('total-balance');
            const incomeEl = document.getElementById('total-income');
            const expenseEl = document.getElementById('total-expense');

            list.innerHTML = '';
            let income = 0;
            let expense = 0;

            transactions.forEach((t, index) => {
                const isIncome = t.type === 'income';
                if (isIncome) income += t.amount; else expense += t.amount;

                const li = document.createElement('li');
                li.className = `flex justify-between items-center p-4 bg-white rounded-xl shadow-sm border-l-4 ${isIncome ? 'border-green-500' : 'border-red-500'}`;
                li.innerHTML = `
                    <span class="font-medium text-gray-700">${t.desc}</span>
                    <span class="${isIncome ? 'text-green-600' : 'text-red-600'} font-bold">
                        ${isIncome ? '+' : '-'}${t.amount.toLocaleString()}đ
                    </span>
                `;
                list.appendChild(li);
            });

            const balance = income - expense;
            balanceEl.innerText = `${balance.toLocaleString()}đ`;
            incomeEl.innerText = `+${income.toLocaleString()}đ`;
            expenseEl.innerText = `-${expense.toLocaleString()}đ`;

            updateChart(income, expense);
        }

        function addTransaction(type) {
            const desc = document.getElementById('desc').value;
            const amount = parseInt(document.getElementById('amount').value);

            if (!desc || isNaN(amount)) {
                alert("Vui lòng nhập đầy đủ thông tin!");
                return;
            }

            transactions.unshift({ desc, amount, type });
            document.getElementById('desc').value = '';
            document.getElementById('amount').value = '';
            updateUI();
        }

        function updateChart(income, expense) {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            
            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Thu nhập', 'Chi tiêu'],
                    datasets: [{
                        data: [income, expense],
                        backgroundColor: ['#4ade80', '#f87171'],
                        borderWidth: 0
                    }]
                },
                options: {
                    plugins: { legend: { position: 'bottom' } },
                    cutout: '70%'
                }
            });
        }

        // Initialize empty chart
        updateChart(0, 0);
    </script>
</body>
</html>
