services:
  db:
    image: postgres:15-alpine
    container_name: spending_db
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - expense-network
    healthcheck:                        # ✅ Chờ DB thật sự sẵn sàng
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: fastapi_app
    env_file:
      - ./backend/.env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      # ✅ Đúng driver asyncpg, đúng thông tin khớp .env
      - DATABASE_URL=postgresql+asyncpg://postgres:password123@db:5432/spending_db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/code
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy   # ✅ Chờ healthcheck pass mới start
    networks:
      - expense-network

  frontend:
    build: ./frontend
    container_name: nextjs_app
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000  # ✅ Dùng tên service
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - expense-network
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  expense-network:
    driver: bridge